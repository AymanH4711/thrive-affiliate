    <meta property="og:type" content="website" />

    <!-- Schema: Site Identity -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "ThriveHealth360",
      "url": "https://www.thrivehealth360.com",
      "description": "Evidence-based prediabetes reversal guides and glucose monitoring tools.",

        "@type": "SearchAction",
        "target": "https://www.thrivehealth360.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "ThriveHealth360",
        "logo": "https://www.thrivehealth360.com/images/brand/logo.svg"
      },
      "sameAs": [
        "https://www.facebook.com/thrivehealth360",
        "https://twitter.com/thrivehealth360"
      ]
    }
